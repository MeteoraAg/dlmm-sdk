name: DLMM Cli

on:
  pull_request:
    branches:
      - main

env:
  SOLANA_CLI_VERSION: 2.1.0
  NODE_VERSION: 22.23.4
  ANCHOR_CLI_VERSION: 0.31.0

jobs:
  cli_changed_files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli: ${{steps.changed-files-specific.outputs.cli}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Get specific changed files
        id: changed-files-specific
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            cli:
              - "cli/**"
              - "commons/**"
              - "Cargo.toml"
              - "Cargo.lock"

  cli_build:
    runs-on: ubuntu-latest
    needs: cli_changed_files
    if: needs.cli_changed_files.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Install rust + toolchain
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: 1.85.0
          components: clippy
      # Cache rust, cargo
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p cli
        shell: bash
